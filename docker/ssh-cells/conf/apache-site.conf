# The twin's site: PHP through PHP-FPM (php*-fpm conf), any port start.sh listens on.
<VirtualHost *:*>
    DocumentRoot /var/www/site/public
    <Directory /var/www/site/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
