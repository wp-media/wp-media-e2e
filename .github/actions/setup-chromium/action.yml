name: Node, packages and Chromium
description: >-
  Node from .nvmrc, npm 12, the locked packages, and Playwright's Chromium, cached. Runs after
  actions/checkout (a local action is read from the checkout).
runs:
  using: composite
  steps:
    # No setup-node cache (`cache: npm`, or its automatic one from devEngines): it asks `npm config
    # get cache` in the checkout before npm 12 is installed, and there Node 26's own npm 11 fails
    # even that on package.json's devEngines (EBADDEVENGINES), failing the step. So: npm 12 first,
    # then the same ~/.npm cache by hand. ci.yml's quality job does the same.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    # The latest npm of this major (new 12.x releases come in without an edit; npm ci then checks
    # package.json's devEngines floor), then proof it is the npm on PATH; ci.yml's quality job does
    # the same.
    - name: Install npm
      env:
        NPM_MAJOR: 12
      run: |
        npm install --global "npm@$NPM_MAJOR"
        v="$(npm --version)"
        case "$v" in "$NPM_MAJOR".*) ;; *) echo "::error::npm is $v, not $NPM_MAJOR.x"; exit 1 ;; esac
      shell: bash
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    # --ignore-scripts: no browser postinstall, no husky; Chromium is installed below.
    - run: npm ci --ignore-scripts
      shell: bash
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    # Not `install --with-deps`: the runner image already ships every library Chromium needs, and
    # that flag runs apt on every job only to add 21 MB of fonts no test uses — when Ubuntu's mirror
    # crawls, it stalls the job until its time limit. apt runs only if Chromium cannot start.
    # `--only-shell`: every CI run is headless, which launches chromium-headless-shell; the full
    # Chrome for Testing build is only for headed runs (healthcheck:ui, --headed), never run here.
    - name: Install Chromium
      shell: bash
      run: |
        npx playwright install --only-shell chromium
        launch() { node --input-type=module -e 'import { chromium } from "@playwright/test"; await (await chromium.launch()).close();'; }
        if ! launch; then
          echo "::warning::Chromium does not start on this runner image; installing its system libraries with apt."
          npx playwright install-deps chromium
          launch
        fi
