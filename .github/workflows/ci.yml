name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check · lint · format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: skip the Playwright browser postinstall + husky; not needed for static checks.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Named jobs, not a matrix: the gate reads each result by name, and `fail-fast` cannot cancel
  # another shard. Keep them identical except for the shard and artifact name. Playwright shards by
  # file (no `fullyParallel`), balanced by test count in file order, not duration, so more shards
  # can make the slowest one slower: orchestrator/cli.spec.ts (~100 s) dominates the one it lands in.
  # Browser-backed specs (page objects, login, site info, visual A/B, real-runner `*.run.spec.ts`)
  # need Chromium even though these are unit tests with no external environment.
  unit-1:
    name: Unit tests (shard 1/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # A stalled download fails here, not at the job's limit.
      - uses: ./.github/actions/setup-chromium
        timeout-minutes: 5
      # tmux is not on the runner image; live.tmux.spec.ts fails under CI without it. Waits for the
      # dpkg lock (an image's own apt job may hold it) and retries once.
      - name: Install tmux
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          install_tmux() {
            sudo -E apt-get -o DPkg::Lock::Timeout=60 update -qq &&
              sudo -E apt-get -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends tmux
          }
          install_tmux || { sleep 10; install_tmux; }
          tmux -V
      - run: npm run test:unit -- --shard=1/2
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-1
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  unit-2:
    name: Unit tests (shard 2/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # A stalled download fails here, not at the job's limit.
      - uses: ./.github/actions/setup-chromium
        timeout-minutes: 5
      # tmux is not on the runner image; live.tmux.spec.ts fails under CI without it. Waits for the
      # dpkg lock (an image's own apt job may hold it) and retries once.
      - name: Install tmux
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          install_tmux() {
            sudo -E apt-get -o DPkg::Lock::Timeout=60 update -qq &&
              sudo -E apt-get -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends tmux
          }
          install_tmux || { sleep 10; install_tmux; }
          tmux -V
      - run: npm run test:unit -- --shard=2/2
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-2
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-smoke:
    name: E2E smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-chromium
        timeout-minutes: 5
      # No sites.json in CI → the example placeholders are used, so only scenarios that need no
      # WordPress can run. `--grep @noauth` states that explicitly instead of relying on every
      # scenario in the repo happening to be tagged that way: scenarios that drive a real site
      # (`@plugin`, storage, restore) are skipped here and run against a real cell. What remains
      # still exercises config loading + bddgen + step/hook wiring + a real Chromium launch.
      # One step per product in src/projects/products.ts, kept by hand: products.spec.ts checks
      # the list against the repo but not against these steps. Add one with each new product.
      - run: npm run test:wp-rocket -- --grep @noauth
      - run: npm run test:backwpup -- --grep @noauth
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            reports/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Single required status check for branch protection: green only if every job above passed.
  # `if: always()` so it still runs (and fails) when a dependency fails — avoiding the
  # "skipped check counts as passed" footgun.
  gate:
    name: CI gate
    needs: [quality, unit-1, unit-2, e2e-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all jobs to pass
        run: |
          echo "quality=${{ needs.quality.result }}  unit-1=${{ needs.unit-1.result }}  unit-2=${{ needs.unit-2.result }}  e2e-smoke=${{ needs.e2e-smoke.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.unit-1.result }}" != "success" ] \
            || [ "${{ needs.unit-2.result }}" != "success" ] || [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "::error::CI gate failed — one or more jobs did not pass."
            exit 1
          fi
